<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>INFINITE — 50 Worlds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#020106}
#hud{position:fixed;left:16px;top:14px;z-index:20;pointer-events:none;text-shadow:0 2px 14px #000}
#title{font-weight:900;letter-spacing:.18em;font-size:12px;opacity:.9}
#world{margin-top:5px;font-size:11px;opacity:.62;letter-spacing:.08em}
.controls{position:fixed;z-index:30;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:9px}
button{appearance:none;border:1px solid rgba(255,255,255,.24);background:rgba(8,5,18,.7);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:12px 16px;font-weight:800;letter-spacing:.08em;font-size:11px}
button:active{transform:scale(.96)}
#hint{position:fixed;z-index:20;right:15px;top:14px;font-size:10px;opacity:.45;letter-spacing:.06em;text-align:right;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="title">INFINITE / DREAM DESCENT</div><div id="world">WORLD 01 — THE DOOR THAT REMEMBERS</div></div>
<div id="hint">PINCH / DRAG<br>OR TAP DIVE</div>
<div class="controls">
<button id="back">BACK</button><button id="dive">DIVE ×10</button><button id="surface">SURFACE</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
const hud=document.getElementById('world');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
let zoom=0, panX=0,panY=0,vel=0;
let lastPinch=null,lastTap=0,dragging=false,lastX=0,lastY=0;

const worlds=[
"THE DOOR THAT REMEMBERS","SCHOOL OF STRANGE THINGS","THE EMPTY CLASSROOM","THE DESK WITH A HEART",
"LUNCH BECOMES A GALAXY","THE ROOM OF TOO MANY PLATES","THE MIRROR HALL","CRACK IN THE MIRROR",
"THE OTHER SIDE OF GLASS","FOREST OF WATCHING EYES","MUSHROOM CITY","THE LITTLE ELF PARTY",
"THE BANQUET UNDER THE ROOTS","THE RED MOON CARNIVAL","A HOUSE INSIDE A HOUSE","THE LIBRARY OF DREAMS",
"THE BOOK THAT READS YOU","STAIRCASE WITHOUT A FLOOR","THE OCEAN IN A BEDROOM","THE SKY UNDER THE SEA",
"THE CITY BENEATH THE SKIN","ONE THOUSAND WINDOWS","THE PEOPLE MADE OF STARS","THE CLOCK WITH NO TIME",
"THE GARDEN OF LOST THOUGHTS","THE GIANT EYE","THE EYE WITHIN THE EYE","THE UNIVERSE IN A TEARDROP",
"THE MOUNTAIN IS BREATHING","THE ROOM AT THE END","THE ROOM BEFORE THE BEGINNING","ALL THINGS ARE ONE",
"THE THREAD CONNECTS EVERYTHING","THE INFINITE DINNER TABLE","THE CHILD WHO FOUND THE DOOR",
"THE DOOR INSIDE THE DOOR","THE COSMIC CLASSROOM","THE MUSHROOM SUN","THE DREAMING CITY",
"THE CITY DREAMS OF YOU","THE MIRROR DREAMS OF THE CITY","THE CRACK BECOMES A RIVER",
"THE RIVER BECOMES A SKY","THE SKY BECOMES AN EYE","THE EYE BECOMES A WORLD","THE WORLD BECOMES A SEED",
"THE SEED CONTAINS EVERYTHING","LET GO","YOU ARE HERE","THE DOOR REMEMBERS"
];

function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

function hash(n){return (Math.sin(n*12.9898)*43758.5453)%1}
function rr(a){return Math.abs(hash(a))}
function glowCircle(px,py,r,alpha){
  const g=x.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,`rgba(255,255,255,${alpha})`);
  g.addColorStop(.15,`rgba(190,80,255,${alpha*.45})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
}
function star(px,py,r,a){
 x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();x.globalAlpha=1;
}
function text(t,px,py,size,alpha=.7){
 x.save();x.textAlign='center';x.textBaseline='middle';x.font=`800 ${size}px system-ui`;x.fillStyle=`rgba(255,255,255,${alpha})`;x.fillText(t,px,py);x.restore();
}
function portal(px,py,r,rot,seed){
  x.save();x.translate(px,py);x.rotate(rot);
  for(let k=0;k<5;k++){
    const q=r*(1-k*.13);
    x.strokeStyle=`hsla(${(seed*47+k*33)%360},85%,${55+k*7}%,${.18+k*.08})`;
    x.lineWidth=1.5+k*.8;
    x.beginPath();
    for(let i=0;i<=120;i++){
      const a=i/120*Math.PI*2, wob=1+Math.sin(a*5+seed+k)*.025;
      const px2=Math.cos(a)*q*wob,py2=Math.sin(a)*q*wob;
      if(i)x.lineTo(px2,py2);else x.moveTo(px2,py2);
    }x.stroke();
  }
  x.restore();
}
function motif(seed,px,py,s){
 const type=seed%10;
 x.save();x.translate(px,py);x.globalAlpha=.9;
 if(type===0){ // school
   x.fillStyle='rgba(35,25,50,.85)';x.fillRect(-s*.7,-s*.45,s*1.4,s*.9);
   x.strokeStyle='rgba(255,255,255,.25)';x.strokeRect(-s*.7,-s*.45,s*1.4,s*.9);
   for(let i=-2;i<=2;i++){x.fillStyle='rgba(255,255,255,.13)';x.fillRect(i*s*.22,-s*.2,s*.12,s*.32)}
   text("?",0,s*.18,s*.18,.25);
 } else if(type===1){ // plate
   x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.beginPath();x.arc(0,0,s*.5,0,7);x.stroke();
   for(let i=0;i<8;i++){let a=i*Math.PI/4;x.beginPath();x.arc(Math.cos(a)*s*.2,Math.sin(a)*s*.2,s*.09,0,7);x.stroke()}
 } else if(type===2){ // mirror
   x.strokeStyle='rgba(150,220,255,.45)';x.lineWidth=3;x.strokeRect(-s*.48,-s*.68,s*.96,s*1.36);
   x.strokeStyle='rgba(255,255,255,.15)';x.beginPath();x.moveTo(-s*.35,-s*.4);x.lineTo(s*.3,s*.45);x.stroke();
   x.beginPath();x.moveTo(s*.25,-s*.55);x.lineTo(-s*.35,s*.5);x.stroke();
 } else if(type===3){ // mushroom
   x.fillStyle='rgba(245,80,150,.7)';x.beginPath();x.arc(0,-s*.08,s*.38,Math.PI,0);x.fill();
   x.fillStyle='rgba(240,220,190,.75)';x.fillRect(-s*.08,-s*.05,s*.16,s*.45);
   for(let i=-1;i<=1;i++)star(i*s*.16,-s*.18,s*.025,.8);
 } else if(type===4){ // eye
   x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2;x.beginPath();x.ellipse(0,0,s*.55,s*.3,0,0,7);x.stroke();
   x.fillStyle='rgba(220,80,255,.8)';x.beginPath();x.arc(0,0,s*.12,0,7);x.fill();
 } else if(type===5){ // tiny elf silhouettes
   for(let i=-1;i<=1;i++){x.fillStyle='rgba(120,255,190,.5)';x.beginPath();x.arc(i*s*.25,-s*.15,s*.08,0,7);x.fill();x.fillRect(i*s*.25-s*.045,-s*.05,s*.09,s*.28)}
 } else if(type===6){ // book
   x.strokeStyle='rgba(255,190,80,.5)';x.lineWidth=2;x.strokeRect(-s*.5,-s*.32,s,s*.64);x.beginPath();x.moveTo(0,-s*.32);x.lineTo(0,s*.32);x.stroke();
 } else if(type===7){ // clock
   x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(0,0,s*.42,0,7);x.stroke();x.beginPath();x.moveTo(0,0);x.lineTo(s*.22,-s*.18);x.moveTo(0,0);x.lineTo(-s*.05,s*.25);x.stroke();
 } else if(type===8){ // tree
   x.strokeStyle='rgba(100,255,190,.4)';x.lineWidth=s*.08;x.beginPath();x.moveTo(0,s*.5);x.lineTo(0,-s*.15);x.moveTo(0,0);x.lineTo(-s*.25,-s*.25);x.moveTo(0,s*.02);x.lineTo(s*.25,-s*.3);x.stroke();
   x.fillStyle='rgba(80,220,150,.2)';x.beginPath();x.arc(0,-s*.3,s*.3,0,7);x.fill();
 } else { // infinity
   x.strokeStyle='rgba(220,100,255,.55)';x.lineWidth=3;x.beginPath();x.moveTo(-s*.45,0);x.bezierCurveTo(-s*.15,-s*.45,s*.15,s*.45,s*.45,0);x.bezierCurveTo(s*.15,-s*.45,-s*.15,s*.45,-s*.45,0);x.stroke();
 }
 x.restore();
}

function drawWorld(i,depth,scale,cx,cy){
 if(depth>10)return;
 const seed=i+depth*17;
 const z=scale;
 const radius=Math.min(W,H)*.43*z;
 if(radius<8)return;

 // world atmosphere
 const hue=(i*31+depth*17)%360;
 const grad=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(radius,1));
 grad.addColorStop(0,`hsla(${hue},70%,18%,.32)`);
 grad.addColorStop(.55,`hsla(${(hue+70)%360},70%,10%,.12)`);
 grad.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=grad;x.beginPath();x.arc(cx,cy,radius,0,7);x.fill();

 // stars / particles
 for(let k=0;k<24;k++){
   const a=rr(seed*91+k)*Math.PI*2, d=(.15+rr(seed*7+k)*.8)*radius;
   star(cx+Math.cos(a)*d,cy+Math.sin(a)*d,Math.max(.6,1.5*z),.15+.35*rr(seed+k));
 }

 // architecture / rings
 portal(cx,cy,radius,seed*.17,seed);
 for(let k=0;k<8;k++){
   const a=k*Math.PI/4+seed*.11, d=radius*.78;
   const sx=cx+Math.cos(a)*d, sy=cy+Math.sin(a)*d;
   motif((i+k+depth)%10,sx,sy,Math.max(12,radius*.12));
 }

 // hidden words
 if(depth<4){
   const words=["LET GO","LOOK CLOSER","ALL THINGS ARE ONE","YOU ARE HERE","WAKE UP"];
   text(words[(i+depth)%words.length],cx,cy-radius*.72,Math.max(8,radius*.045),.16);
 }

 // central doorway and recursion
 const inner=radius*.34;
 x.save();x.globalCompositeOperation='lighter';
 glowCircle(cx,cy,inner*1.4,.12);
 x.restore();

 if(depth<9){
   // crack branching into the next world
   x.save();x.translate(cx,cy);x.strokeStyle=`hsla(${(hue+180)%360},80%,70%,.32)`;x.lineWidth=Math.max(1,2*z);
   x.beginPath();
   for(let q=0;q<7;q++){let xx=(q-3)*inner*.16, yy=Math.sin(q*2.7+seed)*inner*.16;if(q===0)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.stroke();x.restore();
   drawWorld((i+1)%50,depth+1,z*.32,cx,cy);
 }
}

function frame(){
 // motion
 zoom+=vel;vel*=.9;
 zoom=Math.max(0,Math.min(49.999,zoom));
 const world=Math.floor(zoom)%50;
 hud.textContent=`WORLD ${String(world+1).padStart(2,'0')} — ${worlds[world]}`;
 x.setTransform(D,0,0,D,0,0);
 x.fillStyle='#020106';x.fillRect(0,0,W,H);

 // global deep-space gradient
 const bg=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
 bg.addColorStop(0,'#0d0718');bg.addColorStop(.45,'#05030b');bg.addColorStop(1,'#010106');
 x.fillStyle=bg;x.fillRect(0,0,W,H);

 // slow parallax
 const cx=W/2+panX,cy=H/2+panY;
 drawWorld(world,0,1,cx,cy);

 // foreground vignette
 const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);
 v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');
 x.fillStyle=v;x.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
frame();

document.getElementById('dive').onclick=()=>{vel+=.018};
document.getElementById('back').onclick=()=>{vel-=.018;zoom=Math.max(0,zoom-.15)};
document.getElementById('surface').onclick=()=>{zoom=0;vel=0;panX=panY=0};

c.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture?.(e.pointerId)});
c.addEventListener('pointermove',e=>{
 if(!dragging)return;
 panX+=(e.clientX-lastX)*.7;panY+=(e.clientY-lastY)*.7;
 lastX=e.clientX;lastY=e.clientY;
});
c.addEventListener('pointerup',()=>dragging=false);
c.addEventListener('wheel',e=>{e.preventDefault();vel+=(-e.deltaY)*.00012},{passive:false});

c.addEventListener('touchstart',e=>{
 if(e.touches.length===1){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;dragging=true}
 if(e.touches.length===2){dragging=false;lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}
},{passive:false});
c.addEventListener('touchmove',e=>{
 e.preventDefault();
 if(e.touches.length===2){
   const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
   if(lastPinch!==null)vel+=(d-lastPinch)*.0007;
   lastPinch=d;
 }else if(e.touches.length===1&&dragging){
   panX+=(e.touches[0].clientX-lastX)*.8;panY+=(e.touches[0].clientY-lastY)*.8;
   lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
 }
},{passive:false});
c.addEventListener('touchend',e=>{
 if(e.touches.length<2)lastPinch=null;
 if(e.touches.length===0)dragging=false;
});
</script>
</body>
</html>
