<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>INFINITE DREAM — 50 Worlds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020107;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#controls{position:fixed;z-index:20;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:flex;gap:8px}
button{border:1px solid #ffffff55;background:#090711ee;color:#fff;border-radius:999px;padding:12px 16px;font-size:12px;font-weight:800;-webkit-tap-highlight-color:transparent}
#msg{position:fixed;z-index:10;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);white-space:nowrap;color:#fff9;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>INFINITE DREAM / 50 WORLDS</span><span>WORLD <b id="depth">01</b>/50</span></div>
<div id="msg">PINCH THE ARTWORK OR TAP DIVE</div>
<div id="controls">
<button id="dive">DIVE ×10</button><button id="back">BACK</button><button id="reset">SURFACE</button>
</div>
<script>
"use strict";
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1,zoom=1,panX=0,panY=0;
let touches=new Map(), pinchDistance=0, pinchZoom=1, dragging=false,lastX=0,lastY=0;

function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const names=[
"THE BEDROOM","THE MORNING","THE WALK","THE SCHOOL GATES","THE CORRIDOR","THE LOCKERS","THE CLASSROOM","THE DESK","THE WINDOW","THE BELL",
"THE LUNCH HALL","THE LUNCH TABLE","THE LAST LESSON","THE JOURNEY HOME","THE EVENING","THE BEDROOM AGAIN","THE MIRROR","THE CRACK","BEHIND THE CRACK","THE HALL OF MIRRORS",
"THE DOOR THAT REMEMBERS","THE FOREST","THE FIRST MUSHROOM","THE GLOW","THE HIDDEN PATH","THE UNDERGROUND","THE ELF MARKET","THE MUSHROOM PARTY","THE DANCE","THE FIRE CIRCLE",
"THE MUSIC MADE VISIBLE","THE LAUGHING MOON","THE OCEAN IN A TEAR","THE CITY INSIDE A DROP","THE LIBRARY OF MEMORIES","THE ROOM OF EVERY VERSION","THE CHILD","THE FUTURE","THE END OF TIME","THE BEGINNING AGAIN",
"THE INFINITE STAIR","THE EYE IN THE WALL","THE GARDEN OF THOUGHTS","THE OCEAN OF DREAMS","THE EMPTY ROOM","THE THING BEYOND THE ROOM","THE UNIVERSE FOLDING","THE LAST MIRROR","THE FIRST THOUGHT","THE LOOP"
];

function rnd(n){const v=Math.sin(n*999.123+17.77)*43758.5453;return v-Math.floor(v)}
function hue(n){return ((n*47.3)%360+360)%360}
function color(n,a=1){return `hsla(${hue(n)},85%,65%,${a})`}
function text(s,y,sz,a=.8){ctx.save();ctx.textAlign="center";ctx.font=`800 ${Math.max(9,sz)}px system-ui`;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillText(s,0,y);ctx.restore()}
function circle(x,y,r,fill,stroke){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
 if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function portal(seed,s){
 const r=s*.16;
 let g=ctx.createRadialGradient(0,0,0,0,0,r*2.2);
 g.addColorStop(0,"#fff");g.addColorStop(.08,color(seed,.95));g.addColorStop(.35,color(seed+9,.45));g.addColorStop(1,"transparent");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.2,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=color(seed+22,.95);ctx.lineWidth=Math.max(2,s*.012);
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#020108";ctx.beginPath();ctx.ellipse(0,0,r*.62,r*.9,0,0,Math.PI*2);ctx.fill();
}
function drawWorld(level,s){
 const seed=5000+level*7919;
 ctx.fillStyle=`hsl(${hue(seed)},45%,6%)`;ctx.fillRect(-s,-s,s*2,s*2);
 let bg=ctx.createRadialGradient(0,0,0,0,0,s);
 bg.addColorStop(0,color(seed,.28));bg.addColorStop(1,"rgba(0,0,0,.98)");
 ctx.fillStyle=bg;ctx.fillRect(-s,-s,s*2,s*2);

 // stars / particles
 for(let i=0;i<100;i++){
  let a=rnd(seed+i)*Math.PI*2,r=s*(.1+rnd(seed+i*2)*.9);
  circle(Math.cos(a)*r,Math.sin(a)*r,.5+rnd(seed+i*3)*1.6,color(seed+i,.45+rnd(i)*.5));
 }

 // World-specific visual anchors
 if(level>=3&&level<=9){
  ctx.strokeStyle=color(seed+20,.4);ctx.lineWidth=2;
  for(let i=-6;i<=6;i++)ctx.strokeRect(i*s*.08,-s*.35,s*.055,s*.65);
  for(let i=0;i<16;i++){let x=(rnd(seed+i)*2-1)*s*.7;circle(x,s*.1,rnd(i+2)*s*.025+.012*s,color(seed+i, .7))}
  text(names[level],s*.45,s*.032);
 } else if(level>=10&&level<=11){
  ctx.fillStyle="#23160f";ctx.fillRect(-s*.7,-s*.12,s*1.4,s*.28);
  for(let i=0;i<12;i++)circle((rnd(seed+i)*2-1)*s*.6,-s*.02,s*.035,color(seed+i,.85));
  text("GOOD FOOD / GOOD MEMORIES",s*.46,s*.028);
 } else if(level>=16&&level<=19){
  ctx.strokeStyle="#bfc9e055";ctx.lineWidth=3;ctx.strokeRect(-s*.48,-s*.68,s*.96,s*1.3);
  ctx.fillStyle="#101522aa";ctx.fillRect(-s*.4,-s*.6,s*.8,s*1.15);
  for(let i=0;i<10;i++){let x=(rnd(seed+i)*2-1)*s*.3,y=(rnd(seed+i+40)*2-1)*s*.5;circle(x,y,s*.025,color(seed+i,.8))}
  if(level>=17){ctx.strokeStyle="#fff9";ctx.lineWidth=1.5;for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo((rnd(seed+i)*2-1)*s*.55,(rnd(seed+i+80)*2-1)*s*.65);ctx.stroke()}}
  text(level===17?"THE CRACK IS A DOOR":"WHO IS LOOKING?",s*.47,s*.03);
 } else if(level>=21&&level<=29){
  // mushroom forest / elf party
  for(let i=0;i<18;i++){
   let x=(rnd(seed+i)*2-1)*s*.85,y=(rnd(seed+i+20)*2-1)*s*.7,m=s*(.04+rnd(seed+i+30)*.08);
   ctx.strokeStyle=color(seed+i,.7);ctx.lineWidth=Math.max(2,m*.16);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+m*2);ctx.stroke();
   ctx.fillStyle=color(seed+i*2,.8);ctx.beginPath();ctx.ellipse(x,y,m,m*.45,0,Math.PI,Math.PI*2);ctx.fill();
  }
  if(level>=26){
   for(let i=0;i<18;i++){
    let x=(rnd(seed+i*4)*2-1)*s*.7,y=(rnd(seed+i*5+20)*2-1)*s*.4;
    circle(x,y-s*.035,s*.02,color(seed+i*7,.9));
    ctx.strokeStyle=color(seed+i*9,.9);ctx.lineWidth=Math.max(1,s*.012);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*.035,y+s*.08);ctx.moveTo(x,y);ctx.lineTo(x+s*.035,y+s*.08);ctx.stroke();
   }
   text("THE MUSHROOM PARTY",s*.46,s*.032);
  }
 } else {
  // increasingly strange cosmic geometry
  for(let q=0;q<8;q++){
   let r=s*(.08+q*.055);ctx.strokeStyle=color(seed+q*31,.35);ctx.lineWidth=1;
   ctx.beginPath();for(let i=0;i<7;i++){let a=i*Math.PI*2/7+q*.2;let rr=r*(.75+.25*Math.sin(i*4.1+seed));let x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();
  }
  for(let i=0;i<14;i++){let a=rnd(seed+i)*Math.PI*2,r=s*(.18+rnd(seed+i+50)*.55);let x=Math.cos(a)*r,y=Math.sin(a)*r;circle(x,y,s*.012,color(seed+i*11,.7));}
  text(names[level],s*.46,s*.028,.62);
 }

 // next-world portal always visible
 if(level<49){
   portal(seed+level,s);
 }else{
   portal(seed+999,s);
   text("THE LOOP",s*.46,s*.035);
 }
}

// 50 worlds are recursively nested inside the central portal.
// We deliberately cap recursion for performance; zoom reveals deeper levels continuously.
function recursive(level,s){
 drawWorld(level,s);
 if(level<49){
  const r=s*.16;
  ctx.save();
  ctx.beginPath();ctx.ellipse(0,0,r*.60,r*.88,0,0,Math.PI*2);ctx.clip();
  recursive(level+1,r*.72);
  ctx.restore();
 }
}

function render(){
 ctx.clearRect(0,0,W,H);
 const base=Math.min(W,H)*.62;
 ctx.save();
 ctx.translate(W/2+panX,H/2+panY);
 ctx.scale(zoom,zoom);
 recursive(0,base);
 ctx.restore();
 const world=Math.max(1,Math.min(50,Math.floor(Math.log(Math.max(1,zoom))/Math.log(1.9))+1));
 document.getElementById("depth").textContent=String(world).padStart(2,"0");
 requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Buttons use simple click events and are deliberately above the canvas.
document.getElementById("dive").addEventListener("click",()=>{zoom=Math.min(1e30,zoom*Math.pow(1.9,10))});
document.getElementById("back").addEventListener("click",()=>{zoom=Math.max(.72,zoom/Math.pow(1.9,5))});
document.getElementById("reset").addEventListener("click",()=>{zoom=1;panX=0;panY=0});

// Native iOS pinch.
canvas.addEventListener("touchstart",e=>{
 e.preventDefault();
 for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});
 if(touches.size===1){const t=e.changedTouches[0];dragging=true;lastX=t.clientX;lastY=t.clientY}
 if(touches.size===2){
  const a=[...touches.values()];
  pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  pinchZoom=zoom;dragging=false;
 }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
 e.preventDefault();
 for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});
 if(touches.size===1&&dragging){
  const t=e.changedTouches[0];panX+=t.clientX-lastX;panY+=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;
 }
 if(touches.size>=2){
  const a=[...touches.values()].slice(0,2);
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(pinchDistance>0)zoom=Math.max(.72,Math.min(1e30,pinchZoom*d/pinchDistance));
 }
},{passive:false});

canvas.addEventListener("touchend",e=>{
 e.preventDefault();
 for(const t of e.changedTouches)touches.delete(t.identifier);
 if(touches.size===0){dragging=false;pinchDistance=0}
},{passive:false});
canvas.addEventListener("touchcancel",()=>{touches.clear();dragging=false;pinchDistance=0},{passive:false});
</script>
</body>
</html>
